name: Build KaraStore APK

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/build-apk.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      VERSION_CODE: ${{ github.run_number }}
    steps:
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Create Android project
        run: |
          mkdir -p app/app/src/main/java/com/karastore/app
          mkdir -p app/app/src/main/res/values app/app/src/main/res/drawable
          cd app

          cat > settings.gradle <<'EOF'
          pluginManagement {
              repositories { google(); mavenCentral(); gradlePluginPortal() }
          }
          dependencyResolutionManagement {
              repositories { google(); mavenCentral() }
          }
          rootProject.name = "KaraStore"
          include ':app'
          EOF

          cat > build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.5.2' apply false
          }
          EOF

          cat > gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx2048m
          android.useAndroidX=false
          EOF

          cat > app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
          }
          android {
              namespace 'com.karastore.app'
              compileSdk 34
              defaultConfig {
                  applicationId 'com.karastore.app'
                  minSdk 21
                  targetSdk 34
                  versionCode((System.getenv('VERSION_CODE') ?: '1').toInteger())
                  versionName "1.${System.getenv('VERSION_CODE') ?: '1'}"
              }
              buildTypes {
                  debug { minifyEnabled false }
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }
          EOF

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />
              <uses-feature android:name="android.hardware.touchscreen" android:required="false" />
              <uses-feature android:name="android.software.leanback" android:required="false" />
              <application
                  android:label="@string/app_name"
                  android:icon="@drawable/ic_launcher"
                  android:banner="@drawable/banner"
                  android:usesCleartextTraffic="true"
                  android:theme="@android:style/Theme.Material.Light.NoActionBar">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:configChanges="orientation|screenSize|keyboardHidden|screenLayout|smallestScreenSize">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                          <category android:name="android.intent.category.LEANBACK_LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          cat > app/src/main/res/values/strings.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <string name="app_name">متجر كارة</string>
          </resources>
          EOF

          cat > app/src/main/res/drawable/ic_launcher.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp" android:height="108dp"
              android:viewportWidth="108" android:viewportHeight="108">
              <group>
                  <clip-path android:pathData="M20,0h68a20,20 0 0 1 20,20v68a20,20 0 0 1 -20,20h-68a20,20 0 0 1 -20,-20v-68a20,20 0 0 1 20,-20z" />
                  <path android:fillColor="#4A148C" android:pathData="M0,0h108v108h-108z" />
                  <path android:fillColor="#6A1FC4" android:pathData="M0,0h108v46l-108,40z" />
                  <path android:strokeColor="#FFC93C" android:strokeWidth="5" android:strokeLineCap="round" android:pathData="M43,40v-7a11,11 0 0 1 22,0v7" />
                  <path android:fillColor="#FFC93C" android:pathData="M27,40h54l-4,42a6,6 0 0 1 -6,5h-34a6,6 0 0 1 -6,-5z" />
                  <path android:fillColor="#4A148C" android:pathData="M48,51l17,10.5l-17,10.5z" />
              </group>
          </vector>
          EOF

          cat > app/src/main/res/drawable/banner.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="320dp" android:height="180dp"
              android:viewportWidth="320" android:viewportHeight="180">
              <path android:fillColor="#4A148C" android:pathData="M0,0h320v180h-320z" />
              <path android:fillColor="#6A1FC4" android:pathData="M0,0h320v80l-320,60z" />
              <path android:strokeColor="#FFC93C" android:strokeWidth="7" android:strokeLineCap="round" android:pathData="M145,62v-10a15,15 0 0 1 30,0v10" />
              <path android:fillColor="#FFC93C" android:pathData="M123,62h74l-6,58a8,8 0 0 1 -8,7h-46a8,8 0 0 1 -8,-7z" />
              <path android:fillColor="#4A148C" android:pathData="M152,77l23,14.5l-23,14.5z" />
          </vector>
          EOF

          cat > app/src/main/java/com/karastore/app/MainActivity.java <<'EOF'
          package com.karastore.app;

          import android.app.Activity;
          import android.content.ActivityNotFoundException;
          import android.content.Intent;
          import android.net.Uri;
          import android.os.Bundle;
          import android.view.KeyEvent;
          import android.webkit.WebChromeClient;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;

          public class MainActivity extends Activity {
              private static final String HOME = "https://ali1990132-ctrl.github.io/Karar-TV/";
              private WebView web;

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  web = new WebView(this);
                  setContentView(web);

                  WebSettings s = web.getSettings();
                  s.setJavaScriptEnabled(true);
                  s.setDomStorageEnabled(true);
                  s.setDatabaseEnabled(true);
                  s.setLoadWithOverviewMode(true);
                  s.setUseWideViewPort(true);
                  s.setMixedContentMode(WebSettings.MIXED_CONTENT_COMPATIBILITY_MODE);

                  web.setWebChromeClient(new WebChromeClient());
                  web.setWebViewClient(new WebViewClient() {
                      @Override
                      public boolean shouldOverrideUrlLoading(WebView view, String url) {
                          return handleUrl(url);
                      }

                      @Override
                      public void onReceivedError(WebView view, int code, String desc, String failingUrl) {
                          String html = "<html dir='rtl'><body style='font-family:sans-serif;text-align:center;padding-top:30%;background:#f5f0ff'>"
                              + "<h2>لا يوجد اتصال بالإنترنت</h2><p>تأكد من الاتصال وحاول مرة أخرى</p>"
                              + "<button style='font-size:18px;padding:12px 30px;background:#7B2FF7;color:#fff;border:0;border-radius:10px' "
                              + "onclick=\"location.href='" + HOME + "'\">إعادة المحاولة</button></body></html>";
                          view.loadDataWithBaseURL(null, html, "text/html", "UTF-8", null);
                      }
                  });

                  // روابط التحميل (مثل ملفات APK) تفتح بالمتصفح
                  web.setDownloadListener((url, ua, cd, mime, len) -> openExternal(url));

                  if (savedInstanceState != null) {
                      web.restoreState(savedInstanceState);
                  } else {
                      web.loadUrl(HOME);
                  }
              }

              private boolean handleUrl(String url) {
                  Uri uri = Uri.parse(url);
                  String scheme = uri.getScheme() == null ? "" : uri.getScheme();
                  String host = uri.getHost() == null ? "" : uri.getHost();
                  // صفحات المتجر نفسه تبقى داخل التطبيق
                  if ((scheme.equals("http") || scheme.equals("https")) && host.endsWith("github.io")) {
                      return false;
                  }
                  // واتساب، اتصال، تيليجرام، روابط خارجية... تفتح بتطبيقاتها
                  if (scheme.equals("intent")) {
                      try {
                          Intent i = Intent.parseUri(url, Intent.URI_INTENT_SCHEME);
                          startActivity(i);
                      } catch (Exception e) {
                          // تجاهل
                      }
                      return true;
                  }
                  openExternal(url);
                  return true;
              }

              private void openExternal(String url) {
                  try {
                      startActivity(new Intent(Intent.ACTION_VIEW, Uri.parse(url)));
                  } catch (ActivityNotFoundException e) {
                      // لا يوجد تطبيق يفتح هذا الرابط
                  }
              }

              @Override
              protected void onSaveInstanceState(Bundle outState) {
                  super.onSaveInstanceState(outState);
                  web.saveState(outState);
              }

              @Override
              public boolean onKeyDown(int keyCode, KeyEvent event) {
                  if (keyCode == KeyEvent.KEYCODE_BACK && web.canGoBack()) {
                      web.goBack();
                      return true;
                  }
                  return super.onKeyDown(keyCode, event);
              }
          }
          EOF

      - name: Build APK
        working-directory: app
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Rename APK
        run: cp app/app/build/outputs/apk/debug/app-debug.apk KaraStore.apk

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: KaraStore-apk
          path: KaraStore.apk

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-v${{ github.run_number }}
          name: متجر كارة APK v1.${{ github.run_number }}
          files: KaraStore.apk
          make_latest: true
