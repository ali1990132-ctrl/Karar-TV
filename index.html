<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>القالب النهائي - كارة ستور</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background-color: #121212;
            color: #ffffff;
            padding-bottom: 70px; /* مسافة للشريط السفلي المثبت */
        }
        header {
            background: #1f1f1f;
            padding: 15px;
            text-align: center;
            border-bottom: 1px solid #333;
        }
        header h1 {
            color: #ff9800;
            font-size: 1.5rem;
        }
        .container {
            padding: 15px;
            max-width: 600px;
            margin: 0 auto;
        }
        .section-title {
            font-size: 1.1rem;
            margin: 15px 0 10px;
            color: #ff9800;
            border-right: 3px solid #ff9800;
            padding-right: 8px;
        }
        .grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
        }
        .card {
            background: #1e1e1e;
            padding: 15px;
            border-radius: 8px;
            text-align: center;
            border: 1px solid #2d2d2d;
            transition: 0.2s;
        }
        .card:hover {
            border-color: #ff9800;
        }
        /* الشريط السفلي المثبت */
        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            background: #1a1a1a;
            border-top: 1px solid #333;
            display: flex;
            justify-content: space-around;
            padding: 10px 0;
            z-index: 1000;
        }
        .nav-item {
            color: #fff;
            text-decoration: none;
            font-size: 0.9rem;
            display: flex;
            flex-direction: column;
            align-items: center;
            background: none;
            border: none;
            cursor: pointer;
        }
        .nav-item.cart-btn {
            color: #ff9800;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <header>
        <h1>كارة ستور</h1>
    </header>

    <div class="container">
        <div class="section-title">المنتجات المتاحة</div>
        <div class="grid">
            <div class="card">
                <h3>اشتراك مميز</h3>
                <p>وصف المنتج هنا</p>
            </div>
            <div class="card">
                <h3>خدمة أخرى</h3>
                <p>وصف المنتج هنا</p>
            </div>
        </div>
    </div>

    <!-- الشريط السفلي المثبت ويحتوي على السلة -->
    <nav class="bottom-nav">
        <a href="#" class="nav-item">الرئيسية</a>
        <a href="#" class="nav-item">الطلبات</a>
        <button class="nav-item cart-btn">
            🛒 السلة
        </button>
        <a href="#" class="nav-item">حسابي</a>
    </nav>

</body>
</html>
